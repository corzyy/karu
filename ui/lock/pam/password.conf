# PAM configuration for the Karu lockscreen.
#
# Quickshell reads this file directly (configDirectory: "pam" relative to
# LockContext.qml) so no system files under /etc/pam.d are touched.
#
# Password-only authentication through pam_unix. Add a fingerprint line such as
#   auth sufficient pam_fprintd.so
# above the pam_unix line to allow a fingerprint first and password as fallback.
auth required pam_unix.so
